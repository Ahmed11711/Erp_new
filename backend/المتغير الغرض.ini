المتغير	الغرض
SHOPIFY_SHOP_DOMAIN	نطاق المتجر، مثل: your-store.myshopify.com
SHOPIFY_ADMIN_ACCESS_TOKEN	Admin API access token من التطبيق المخصص
SHOPIFY_WEBHOOK_SECRET	API secret الخاص بالتطبيق (للتحقق من توقيع الويب هوك HMAC)
SHOPIFY_ALLOWED_SHOP_DOMAINS	(اختياري) تقييد الطلبات لمتجر معيّن

SHOPIFY_DEFAULT_ORDER_SOURCE_ID، SHOPIFY_DEFAULT_SHIPPING_METHOD_ID، SHOPIFY_FALLBACK_CATEGORY_ID، SHOPIFY_TRACKING_USER_ID

شركة الشحن (خارج Shopify)
SHIPPING_API_BASE_URL + SHIPPING_API_TOKEN لإرسال الطلب لشركة الشحن.
SHIPPING_WEBHOOK_SECRET لاستقبال POST /api/webhooks/shipping/update من شركة الشحن.
باختصار: تحتاج من Shopify متجر + Custom app يعطي Domain + Admin token + Webhook secret، مع Scopes تغطي الطلبات والمنتجات (قراءة وكتابة إن أردتم المزامنة العكسية) والتنفيذ/الإلغاء على الطلبات، وتسجيل Webhooks على الرابط أعلاه