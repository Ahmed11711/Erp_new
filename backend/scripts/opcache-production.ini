<?php
/**
 * PHP OPcache settings for production server.
 * Copy relevant lines to php.ini or include this file from php.ini:
 *   zend_extension=opcache
 *   include="C:/path/to/Erp_new/backend/scripts/opcache-production.ini"
 *
 * On Linux/cPanel: add to php.ini or .user.ini in public folder.
 */

; Enable OPcache
opcache.enable=1
opcache.enable_cli=0

; Memory — increase if app is large
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Do not revalidate files on every request in production
opcache.validate_timestamps=0
opcache.revalidate_freq=0

; Preload (PHP 7.4+) — optional, uncomment if you set up preload script
; opcache.preload=/path/to/backend/preload.php
; opcache.preload_user=www-data

realpath_cache_size=4096K
realpath_cache_ttl=600
