<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>Magalis</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="assets/webfonts/MaterialIcons-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/webfonts/fa-solid-900.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function () {
      var path = location.pathname || '';
      if (path === '/dashboard' || path.indexOf('/dashboard/') === 0) {
        return;
      }
      var rest = path.replace(/^\/[Dd]ashboard(?=\/|$)/, '/dashboard');
      if (rest !== path) {
        location.replace(rest + location.search + location.hash);
      }
    })();
  </script>
</head>
<body class="mat-typography">
  <app-root></app-root>
  <div id="boot-fail" style="display:none;direction:rtl;font-family:Tahoma,sans-serif;max-width:480px;margin:12vh auto;padding:24px;text-align:center;color:#1f2937">
    <p style="font-size:18px;margin-bottom:12px">تعذر تحميل الصفحة.</p>
    <p style="margin-bottom:16px">افتح الموقع من Google Chrome وسجّل الدخول، ثم أعد فتح الرابط.</p>
    <a id="boot-fail-link" href="/" style="color:#82225e">فتح صفحة الدخول</a>
  </div>
  <script>
    (function () {
      setTimeout(function () {
        var root = document.querySelector('app-root');
        if (root && root.childNodes.length === 0) {
          var box = document.getElementById('boot-fail');
          if (box) { box.style.display = 'block'; }
        }
      }, 8000);
    })();
  </script>
</body>
</html>
