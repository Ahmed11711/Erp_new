<div class="container-fluid" dir="rtl">
  <div class="row py-3 bg-light">
    <div class="col-3 d-flex align-items-center">
      <app-time></app-time>
    </div>
    <div class="col-6 text-center">
      <h4 class="header m-auto">تعديل صنف</h4>
    </div>
    <div class="col-3"></div>
  </div>
</div>

<div class="container content mt-4 pb-5">
  <form [formGroup]="form" (ngSubmit)="submitform()">

    <!-- اسم الصنف، كود الصنف، اللون — في صف واحد -->
    <div class="form-row">
      <div class="form-group col-md-4">
        <label for="category_name">اسم الصنف</label>
        <input type="text" class="form-control" id="category_name" formControlName="category_name" />
        <div class="form-text text-danger" *ngIf="form.get('category_name')?.touched && form.get('category_name')?.invalid">
          <span *ngIf="form.get('category_name')?.errors?.['required']">مطلوب</span>
        </div>
      </div>
      <div class="form-group col-md-4">
        <label for="item_code">كود الصنف</label>
        <input type="text" class="form-control" id="item_code" formControlName="item_code" maxlength="64" placeholder="اختياري" />
        <small class="form-text text-muted">يُولَّد تلقائياً إن تُرك فارغاً.</small>
      </div>
      <div class="form-group col-md-4">
        <label for="color">اللون</label>
        <div class="d-flex align-items-center" style="gap:8px;">
          <input type="text" class="form-control" id="color" formControlName="color" maxlength="128" placeholder="اختياري" />
          <span class="color-preview"
            *ngIf="form.get('color')?.value"
            [style.backgroundColor]="form.get('color')?.value"
            [title]="form.get('color')?.value">
          </span>
        </div>
      </div>
    </div>

    <!-- سعر الصنف، الرصيد الافتتاحي، الحد الأدنى للمخزون — في صف واحد -->
    <div class="form-row mt-3">
      <div class="form-group col-md-4">
        <label for="category_price">سعر الصنف</label>
        <input type="number" class="form-control" id="category_price" formControlName="category_price" min="0" />
        <div class="form-text text-danger" *ngIf="form.get('category_price')?.touched && form.get('category_price')?.invalid">
          <span *ngIf="form.get('category_price')?.errors?.['required']">مطلوب</span>
        </div>
      </div>
      <div class="form-group col-md-4">
        <label for="initial_balance">الرصيد الافتتاحي</label>
        <input type="number" class="form-control" id="initial_balance" formControlName="initial_balance" min="0" />
        <div class="form-text text-danger" *ngIf="form.get('initial_balance')?.touched && form.get('initial_balance')?.invalid">
          <span *ngIf="form.get('initial_balance')?.errors?.['required']">مطلوب</span>
        </div>
      </div>
      <div class="form-group col-md-4">
        <label for="minimum_quantity">الحد الأدنى للمخزون</label>
        <input type="number" class="form-control" id="minimum_quantity" formControlName="minimum_quantity" min="0" />
        <div class="form-text text-danger" *ngIf="form.get('minimum_quantity')?.touched && form.get('minimum_quantity')?.invalid">
          <span *ngIf="form.get('minimum_quantity')?.errors?.['required']">مطلوب</span>
        </div>
      </div>
    </div>

    <!-- المخزن، وحدة القياس، خط الإنتاج -->
    <div class="form-row mt-3">
      <div class="form-group col-md-4">
        <label for="warehouse">المخزن</label>
        <select class="form-control" id="warehouse" formControlName="warehouse" (change)="onWarehouseChange()">
          <option [ngValue]="null" disabled>اختر المخزن</option>
          <ng-container *ngFor="let elm of stockData">
            <option
              *ngIf="canSelectWarehouse(elm.name)"
              [ngValue]="elm.name">
              {{ elm.name }}
            </option>
          </ng-container>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label for="measurement_id">وحدة القياس</label>
        <select class="form-control" id="measurement_id" formControlName="measurement_id">
          <option [ngValue]="null" disabled>اختر وحدة القياس</option>
          <option *ngFor="let unit of unitsData" [ngValue]="unit.id">{{ unit.unit }}</option>
        </select>
      </div>
      <div class="form-group col-md-4">
        <label for="production_id">خط الإنتاج</label>
        <select class="form-control" id="production_id" formControlName="production_id">
          <option [ngValue]="null" disabled>اختر خط الإنتاج</option>
          <option *ngFor="let production of productionData" [ngValue]="production.id">{{ production.production_line }}</option>
        </select>
      </div>
    </div>

    <!-- نوع المنتج والسماح بالبيع -->
    <!-- <div class="form-row mt-3">
      <div class="form-group col-md-4">
        <label for="product_type">نوع المنتج</label>
        <select class="form-control" id="product_type" formControlName="product_type">
          <option [ngValue]="null">تلقائي (حسب المخزن)</option>
          <option value="raw_material">مادة خام</option>
          <option value="semi_finished">تحت التشغيل</option>
          <option value="finished">منتج تام</option>
        </select>
        <small class="form-text text-muted">إن تُرك فارغاً يُحدَّد تلقائياً من المخزن المختار.</small>
      </div>
      <div class="form-group col-md-4 d-flex align-items-end">
        <div class="form-check">
          <input type="checkbox" class="form-check-input" id="allow_wip_sale" formControlName="allow_wip_sale" />
          <label class="form-check-label" for="allow_wip_sale">السماح ببيع تحت التشغيل</label>
        </div>
      </div>
    </div> -->

    <!-- صورة الصنف -->
    <div class="form-group mt-3">
      <label>صورة الصنف</label>
      <div class="element d-flex align-items-center">
        <i (click)="openFileInput()" class="fa fa-camera mr-2" style="cursor:pointer;"></i>
        <span class="name">{{ imgtext }}</span>
        <input type="file" (change)="onFileChanged($event)" name="uploadFile" accept="image/*" id="fileInput" class="img d-none" />
      </div>
    </div>

    <button type="submit" [disabled]="form.invalid" class="btn btn-primary mt-3 px-5">تعديل</button>
  </form>
</div>
