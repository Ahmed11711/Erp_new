<div class="report-page">
  <div class="report-topbar">
    <div class="report-topbar-side">
      <app-time></app-time>
    </div>
    <h1 class="report-title">ميزانية المراجعة</h1>
    <div class="report-topbar-side"></div>
  </div>

  <div class="report-panel">
    <form class="mb-0" [formGroup]="form" (ngSubmit)="submitform()">
      <div class="filter-chips flex-wrap">
        <div class="chip chip-date">
          <i class="fa-regular fa-calendar"></i>
          <span class="date-range">
            <input type="date" (change)="onDateFromChange($event)" [value]="dateFrom">
            <span class="date-sep">—</span>
            <input type="date" (change)="onDateToChange($event)" [value]="dateTo">
          </span>
        </div>
        <div class="chip chip-search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="search" placeholder="البحث..." id="example-search-input">
        </div>
      </div>
    </form>
  </div>

  <div class="report-content-card">
    <div class="report-table-wrap">
      <table class="table report-data-table text-center">
        <thead>
          <tr>
            <th rowspan="2" class="align-middle text-center">اسم الحساب</th>
            <th colspan="2">رصيد اول المدة</th>
            <th colspan="2">الحركة</th>
            <th colspan="2">رصيد اخر المدة</th>
          </tr>
          <tr>
            <th>مدين</th>
            <th>دائن</th>
            <th>مدين</th>
            <th>دائن</th>
            <th>مدين</th>
            <th>دائن</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let elm of data">
            <td>{{ elm.name }}</td>
            <td>{{ elm.type }}</td>
            <td>0</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
