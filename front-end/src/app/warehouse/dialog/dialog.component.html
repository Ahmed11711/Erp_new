<div class="container content">
  <div class="d-flex justify-content-center align-items-center h-100" style="flex-direction: column;">
    <h1 class="text-center">{{ data.id ? 'تعديل مخزن' : (data.name ? 'ربط المخزن بالحساب' : 'اضافة مخزن') }}</h1>
  </div>
    <form class="text-start" [formGroup]="form" (ngSubmit)="submitform()">
      <div class="mb-3">
        <input class="form-control" placeholder="الاسم"
        [readonly]="!!data.lockWarehouseName"
        [class.is-valid]="form.get('name')?.errors ==null && form.get('name')?.touched"
        formControlName="name" type="text">
        <p *ngIf="form.get('name')?.errors !=null && form.get('name')?.touched"
          class="error mb-0 text-danger">مطلوب</p>
      </div>
      <div class="mb-3">
        <input class="form-control"   placeholder="الرصيد"
        [class.is-valid]="form.get('balance')?.errors ==null && form.get('balance')?.touched"
        formControlName='balance' type="number" class="form-control" min="0" step="any">
        <p *ngIf="form.get('balance')?.errors !=null && form.get('balance')?.touched"
          class="error mb-0 text-danger">مطلوب</p>
      </div>
      <div class="mb-3">
        <div class="ng-autocomplete asset-ac"
          [class.is-valid]="form.get('asset_id')?.errors == null && form.get('asset_id')?.touched">
          <ng-autocomplete
            *ngIf="assetFieldReady"
            [data]="assetData"
            [searchKeyword]="assetKeyword"
            [minQueryLength]="0"
            [initialValue]="assetInitialValue"
            placeholder="الاصل — ابحث بالاسم"
            (selected)="onAssetSelected($event)"
            (inputChanged)="onAssetInputChanged($event)"
            (closed)="syncAssetFromInput()"
            (inputCleared)="onAssetCleared()"
            [itemTemplate]="assetItemTemplate"
            [notFoundTemplate]="assetNotFoundTemplate">
          </ng-autocomplete>
          <ng-template #assetItemTemplate let-item>
            <a [innerHTML]="item.name"></a>
          </ng-template>
          <ng-template #assetNotFoundTemplate let-notFound>
            <div [innerHTML]="notFound"></div>
          </ng-template>
        </div>
        <p *ngIf="form.get('asset_id')?.errors != null && form.get('asset_id')?.touched"
          class="error mb-0 text-danger">مطلوب</p>
      </div>
      <div class="text-center">
        <button type="submit" class="btn text-white">{{data.id ? 'تعديل' : 'اضافة'}}</button>
      </div>
    </form>
</div>
