<div class="container-fluid give-to-client-page" dir="rtl">
    <div class="card">
        <div class="card-header">
            <h3 class="mb-0">دفعة مقدمة نقدية لعميل</h3>
            <p class="text-muted small mb-0 mt-1">
                اختر مصدر الصرف: خزنة، بنك، أو حساب خدمي
            </p>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-6 form-group">
                    <label>مكان الصرف</label>
                    <select class="form-control" [(ngModel)]="paymentPlace" (ngModelChange)="onPlaceChange()">
                        <option ngValue="safe">خزنة</option>
                        <option ngValue="bank">بنك</option>
                        <option ngValue="service_account">حساب خدمي</option>
                    </select>
                </div>

                <div class="col-md-6 form-group" *ngIf="paymentPlace === 'safe'">
                    <label>الخزينة</label>
                    <select class="form-control" [(ngModel)]="selectedSourceId">
                        <option [ngValue]="null" disabled>— اختر الخزينة —</option>
                        <option *ngFor="let s of safes" [ngValue]="s.id">
                            {{ s.name }} — رصيد: {{ s.balance | number:'1.2-2' }}
                        </option>
                    </select>
                </div>
                <div class="col-md-6 form-group" *ngIf="paymentPlace === 'bank'">
                    <label>البنك</label>
                    <select class="form-control" [(ngModel)]="selectedSourceId">
                        <option [ngValue]="null" disabled>— اختر البنك —</option>
                        <option *ngFor="let b of banks" [ngValue]="b.id">
                            {{ b.name }} — رصيد: {{ b.balance | number:'1.2-2' }}
                        </option>
                    </select>
                </div>
                <div class="col-md-6 form-group" *ngIf="paymentPlace === 'service_account'">
                    <label>الحساب الخدمي</label>
                    <select class="form-control" [(ngModel)]="selectedSourceId">
                        <option [ngValue]="null" disabled>— اختر الحساب الخدمي —</option>
                        <option *ngFor="let a of serviceAccounts" [ngValue]="a.id">
                            {{ a.name }} — رصيد: {{ a.balance | number:'1.2-2' }}
                        </option>
                    </select>
                </div>

                <div class="col-md-6 form-group">
                    <label>العميل</label>
                    <input
                        type="text"
                        class="form-control mb-2"
                        placeholder="بحث بالاسم أو الموبايل..."
                        [(ngModel)]="clientSearch"
                        (ngModelChange)="onClientSearchChange()"
                    />
                    <select class="form-control" [(ngModel)]="selectedClientKey">
                        <option [ngValue]="null" disabled>— اختر العميل —</option>
                        <optgroup label="عملاء الشركات">
                            <option *ngFor="let client of clientOptions.companies" [ngValue]="'company:' + client.id">
                                {{ client.label }}
                            </option>
                        </optgroup>
                        <optgroup label="عملاء الأفراد">
                            <option *ngFor="let person of clientOptions.individuals" [ngValue]="'individual:' + person.phone">
                                {{ person.label }}
                            </option>
                        </optgroup>
                    </select>
                </div>
                <div class="col-md-6 form-group">
                    <label>المبلغ</label>
                    <input type="number" class="form-control" [(ngModel)]="voucher.amount" min="0.01" step="0.01" dir="ltr">
                </div>
                <div class="col-md-6 form-group">
                    <label>التاريخ</label>
                    <input type="date" class="form-control" [(ngModel)]="voucher.date" dir="ltr">
                </div>
                <div class="col-md-12 form-group">
                    <label>ملاحظات</label>
                    <textarea class="form-control" [(ngModel)]="voucher.notes" rows="2"></textarea>
                </div>
            </div>
        </div>
        <div class="card-footer">
            <button type="button" class="btn btn-primary" (click)="save()">حفظ</button>
        </div>
    </div>
</div>
