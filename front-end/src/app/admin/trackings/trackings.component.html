<div class="container-fluid">
  <div class="row py-3">
    <div class="col-4 d-flex align-items-center">
      <app-time></app-time>
    </div>
    <div class="col-5">
      <div><p class="title header w-50 m-auto">تتبع</p></div>
    </div>
    <div class="col-3 d-flex align-items-center justify-content-end">
    </div>
  </div>

  <div class="container-fluid">

    <form [formGroup]="form">
      <div class="row mb-2">
        <div class="col-md-2">
          <input class="form-control" type="date" formControlName="created_at">
        </div>
        <div class="col-md-2">
          <select class="form-control" formControlName="user_id">
            <option selected disabled value="0">المستخدم </option>
            <option [value]="elm.id" *ngFor="let elm of userdata" [id]="elm.id">{{elm.name}}</option>
          </select>
        </div>
      </div>
    </form>

    <div class="alert alert-warning text-center" *ngIf="loadError">{{ loadError }}</div>

    <div class="card shadow-sm mb-4 border-0">
      <div>
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center mb-0">
            <thead class="text-white">
              <tr>
                <th>order</th>
                <th>type</th>
                <th>action</th>
                <th>date</th>
                <th>user</th>
                <th>undo</th>
                <th *ngIf="canEditTracking">فتح</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngIf="!dataList.length && !loadError">
                <td [attr.colspan]="canEditTracking ? 7 : 6">لا توجد سجلات للعرض.</td>
              </tr>
              <tr *ngFor="let elm of dataList">
                <td>
                  <span style="cursor: pointer;" [routerLink]="['/dashboard/shipping/orderdetails', elm?.order_id]">
                    {{ elm?.order_id }}
                  </span>
                </td>
                <td>{{ elm?.type || elm?.action }}</td>
                <td>{{ elm?.action }}</td>
                <td dir="ltr">{{ elm?.created_at | date: 'EEEE, yyyy-MM-dd , hh:mm a' }}</td>
                <td>{{ elm?.user?.name || '—' }}</td>
                <td>
                  <div *ngIf="canUndo(elm)">
                    <span
                      [matMenuTriggerFor]="trackingMenu"
                      (click)="selectedTrackingId = elm?.id"
                      style="cursor: pointer;">
                      <mat-icon>more_vert</mat-icon>
                    </span>
                  </div>
                </td>
                <td *ngIf="canEditTracking">
                  <a *ngIf="canOpenEdit(elm)"
                     [routerLink]="editLink(elm)"
                     title="فتح الأوردر للتعديل"
                     style="cursor: pointer;">
                    <mat-icon>open_in_new</mat-icon>
                  </a>
                  <span *ngIf="!canOpenEdit(elm)">—</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <mat-menu #trackingMenu="matMenu">
    <button mat-menu-item (click)="selectedTrackingId && undo(selectedTrackingId)">
      <span>تراجع</span>
    </button>
  </mat-menu>

  <div class="text-center mt-5">
    <mat-paginator
      class="demo-paginator"
      [length]="length"
      [pageSize]="pageSize"
      [pageIndex]="page"
      showFirstLastButtons
      (page)="onPageChange($event)"
      [pageSizeOptions]="pageSizeOptions"
      aria-label="Select page">
    </mat-paginator>
  </div>
</div>
