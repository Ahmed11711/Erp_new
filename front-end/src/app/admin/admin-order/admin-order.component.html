<div class="container-fluid">
  <div class="row py-3">
    <div class="col-4 d-flex align-items-center">
      <app-time></app-time>
    </div>
    <div class="col-5">
      <div><p class="title header w-50 m-auto">الاوردرات</p></div>
    </div>
    <div class="col-3 d-flex align-items-center justify-content-end">
    </div>
  </div>

  <div class="container-fluid">
    <div class="alert alert-warning text-center" *ngIf="loadError">{{ loadError }}</div>

    <div class="text-center py-4" *ngIf="loading">
      <mat-spinner diameter="40" class="m-auto"></mat-spinner>
    </div>

    <table class="table w-75 m-auto text-center" *ngIf="!loading">
      <thead class="bg-dark text-white">
        <tr>
          <th>رقم الاوردر</th>
          <th>صاحب الاوردر</th>
          <th>الحالة</th>
          <th>موافقة</th>
          <th>رفض</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="data.length === 0">
          <td colspan="5">لا توجد أوردرات بانتظار المراجعة</td>
        </tr>
        <tr *ngFor="let item of data">
          <td>
            <a [routerLink]="['/dashboard/shipping/orderdetails', orderId(item)]" target="_blank">
              {{ orderId(item) }}
            </a>
          </td>
          <td>{{ ownerName(item) }}</td>
          <td>{{ statusLabel(item) }}</td>
          <td>
            <i class="fa-solid fa-check text-success" (click)="approve(item)" title="موافقة"></i>
          </td>
          <td>
            <i class="fa-solid fa-xmark text-danger" (click)="reject(item)" title="رفض"></i>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="mt-4" *ngIf="!loading && data.length > 0">
      <mat-paginator
        class="demo-paginator"
        [length]="length"
        [pageSize]="pageSize"
        [pageIndex]="page"
        showFirstLastButtons
        (page)="onPageChange($event)"
        [pageSizeOptions]="pageSizeOptions"
        aria-label="Select page">
      </mat-paginator>
    </div>
  </div>
</div>
